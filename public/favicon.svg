<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle: Uses a subtle glow to stand out against #001a4d -->
  <circle cx="50" cy="50" r="48" fill="url(#bg_gradient)" stroke="#90EE90" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- The 'D' Motif: Styled with the Light Green site color -->
  <path d="M35 30V70H52.5C63.5457 70 72.5 61.0457 72.5 50C72.5 38.9543 63.5457 30 52.5 30H35ZM43 38H52.5C59.1274 38 64.5 43.3726 64.5 50C64.5 56.6274 59.1274 62 52.5 62H43V38Z" fill="#90EE90"/>
  
  <!-- Geometric Tech Accent: The "dash" from your original SVG -->
  <rect x="35" y="47" width="12" height="6" fill="#FFFFFF" fill-opacity="0.8"/>

  <defs>
    <!-- Gradient that bridges the dark background and the light green text -->
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#003366"/> <!-- Matches your mid-tone background -->
      <stop offset="1" stop-color="#001a4d"/> <!-- Matches your dark-tone background -->
    </linearGradient>
  </defs>
</svg>
